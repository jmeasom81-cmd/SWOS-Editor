<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>SWOS Studio v1.15.0</title>
  <style>
    :root{
      --bg:#050a12;--panel:#0d1828;--panel2:#132238;--line:#263d5c;
      --text:#f5f7fb;--muted:#9db0c8;--yellow:#f5d547;--green:#42d184;
      --red:#ff6b6b;--blue:#58a6ff;--shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(circle at 50% -20%,#153660 0,transparent 45%),
      linear-gradient(#07111f,#050a12 55%);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;padding-bottom:94px}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.94);
      backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}
    .brand{font-weight:900;letter-spacing:.08em;color:var(--yellow);font-size:18px}
    .sub{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.35}
    main{max-width:760px;margin:0 auto;padding:16px}
    .hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
    .eyebrow{font-size:11px;font-weight:900;color:var(--green);letter-spacing:.14em;text-transform:uppercase}
    h1,h2,h3{margin:0} h1{font-size:36px;letter-spacing:.03em} h2{font-size:24px}
    h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
    p{line-height:1.5}
    .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
      border-radius:14px;padding:15px;box-shadow:var(--shadow)}
    .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);min-height:48px;
      border-radius:11px;padding:11px 14px;font-weight:800}
    .btn:active{transform:translateY(1px)} .btn-primary{background:var(--yellow);color:#14190a;border-color:#fff3a4}
    .btn-green{background:var(--green);color:#052012;border-color:#8effbc}
    .btn-blue{background:#173b63;color:#dbeeff;border-color:#33689e}
    .btn-danger{border-color:#6e3138;background:#2a151a;color:#ffbec4}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .big{min-height:62px;font-size:17px;width:100%}
    .row{display:flex;gap:9px;align-items:center}.grow{flex:1}.stack{display:grid;gap:10px}
    .search,.field input,.field select{width:100%;height:50px;border-radius:11px;border:1px solid var(--line);
      background:#07111f;color:var(--text);padding:0 14px;outline:none}
    .search:focus,.field input:focus,.field select:focus{border-color:var(--yellow)}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}
    .chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);
      border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800}
    .chip.active{background:var(--yellow);color:#111;border-color:#fff0a0}
    .team{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
      background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px}
    .team-name{font-weight:900;font-size:16px}.meta{font-size:12px;color:var(--muted);margin-top:3px}
    .badge{background:var(--green);color:#041c0f;padding:5px 8px;border-radius:8px;font-size:10px;font-weight:900}
    .badge-blue{background:#2a5d91;color:#e3f2ff}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 18px}
    .fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px}
    .fact small{display:block;color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:.08em}
    .fact strong{display:block;margin-top:4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .player{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:var(--panel);color:var(--text);
      border:1px solid var(--line);border-radius:12px;padding:10px}.player.edited{border-color:var(--green)}
    .shirt{width:42px;height:42px;display:grid;place-items:center;background:#172a45;border:1px solid #365477;border-radius:9px;font-weight:900}
    .player-main{min-width:0;flex:1}.player-name{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .notice{border:1px solid rgba(66,209,132,.55);background:rgba(66,209,132,.08);border-radius:11px;padding:12px;font-size:13px;line-height:1.45}
    .error{border-color:#7b343b;background:#2b1519;color:#ffd0d4}.info{border-color:#345f86;background:#10243b}
    .field label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;display:block;margin-bottom:7px}
    .counter{font-size:11px;color:var(--muted);margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .skills{display:grid;gap:10px}.skill{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px}
    .skill-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.skill strong{font-size:13px}
    .skill-value{font-weight:900;color:var(--yellow);min-width:34px;text-align:right}
    input[type=range]{width:100%;accent-color:var(--yellow);margin-top:8px}
    .tiny{font-size:10px;color:var(--muted);line-height:1.4}
    .footerbar{position:fixed;left:0;right:0;bottom:0;z-index:25;border-top:1px solid var(--line);
      background:rgba(7,17,31,.96);backdrop-filter:blur(10px);padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
    .footerbar .inner{max-width:760px;margin:0 auto;display:flex;gap:8px}.footerbar .btn{flex:1;min-width:0;padding-left:8px;padding-right:8px;font-size:12px}
    .hidden{display:none!important} details{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}
    summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:800} code{color:#d9e9ff}.about{font-size:12px;color:var(--muted)}
    .copy-card{border:1px solid rgba(88,166,255,.48);background:rgba(88,166,255,.07);border-radius:13px;padding:14px}
    .copy-name{display:flex;align-items:center;gap:8px}
    .copy-name input{min-width:0;flex:1}
    .history-list{display:grid;gap:8px;margin-top:10px}
    .history-item{background:#091421;border:1px solid var(--line);border-radius:10px;padding:10px}
    .history-item strong{display:block;font-size:12px}
    .history-item span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
    .undo-card{border:1px solid rgba(245,213,71,.45);background:rgba(245,213,71,.06);border-radius:12px;padding:12px}
    .quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .quick-action{border:1px solid var(--line);background:#0b1726;color:var(--text);border-radius:10px;min-height:58px;padding:8px;font-size:11px;font-weight:800;line-height:1.25}
    .quick-action .qico{display:block;font-size:18px;margin-bottom:4px}
    @media(max-width:430px){.quick-actions{grid-template-columns:repeat(2,1fr)}}
    .active-career{border:1px solid rgba(66,209,132,.55);background:rgba(66,209,132,.08);border-radius:14px;padding:14px}
    .active-career .title{font-weight:900;font-size:18px}
    .active-career .subline{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
    .play-steps{display:grid;gap:12px}
    .play-step{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}
    .play-step .stepno{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:999px;background:var(--yellow);color:#111;font-weight:900;font-size:12px;margin-right:8px}
    .play-step.done .stepno{background:var(--green);color:#052012}
    .play-step h3{display:inline;margin:0;color:var(--text);text-transform:none;letter-spacing:0;font-size:15px}
    .play-step p{margin:8px 0 0;color:var(--muted);font-size:12px}
    .profile-choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px}
    .profile-choice strong{display:block}.profile-choice span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    .save-play{background:var(--yellow);color:#10150a;border-color:#fff0a0}
    .scope-banner{border:1px solid #3c628a;background:#10243b;border-radius:12px;padding:12px;margin-top:14px}
    .scope-banner.career{border-color:rgba(66,209,132,.55);background:rgba(66,209,132,.08)}
    .scope-kicker{display:block;font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--yellow);margin-bottom:4px}
    .scope-banner.career .scope-kicker{color:var(--green)}
    .scope-banner strong{display:block;font-size:14px}
    .scope-banner span:last-child{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:4px}
    .scope-tag{display:inline-block;width:max-content;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--yellow);margin-top:5px}
    .scope-tag.career{color:var(--green);border-color:rgba(66,209,132,.45)}
    .load-progress{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
    .load-progress-head{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px}
    .load-progress-head strong{color:var(--text)}
    .load-progress-head span{color:var(--muted);white-space:nowrap}
    .load-track{height:9px;background:#07111f;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:9px}
    .load-fill{height:100%;width:0;background:var(--yellow);transition:width .18s ease}
    .load-note{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.35}
    .section-gap{margin-top:18px}.back{margin-bottom:14px}.empty{text-align:center;color:var(--muted);padding:26px}
    .kit-preview{display:grid;place-items:center;gap:5px;min-height:150px;background:#07111f;border:1px solid var(--line);border-radius:12px;padding:12px}
    .kit-shirt{width:92px;height:68px;border-radius:16px 16px 10px 10px;border:2px solid rgba(255,255,255,.16);clip-path:polygon(17% 0,34% 9%,66% 9%,83% 0,100% 19%,85% 36%,78% 27%,78% 100%,22% 100%,22% 27%,15% 36%,0 19%)}
    .kit-shorts{width:57px;height:32px;border:2px solid rgba(255,255,255,.16);clip-path:polygon(0 0,100% 0,91% 100%,55% 100%,50% 72%,45% 100%,9% 100%)}
    .kit-socks{display:flex;gap:10px}.kit-sock{width:18px;height:35px;border:2px solid rgba(255,255,255,.16);border-radius:2px 2px 7px 7px}
    .order-row{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px}
    .order-no{width:35px;height:35px;display:grid;place-items:center;border-radius:8px;background:#172a45;font-weight:900}
    .role-badge{font-size:9px;font-weight:900;border-radius:999px;padding:4px 7px;background:#213a59;color:#dbeaff;white-space:nowrap}
    .move-buttons{display:flex;gap:5px}.move-buttons .btn{min-height:36px;padding:5px 9px}
    .split-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .source-card{border:1px solid #31527a;background:#0b1b31;border-radius:12px;padding:12px}
    .good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}
    .source-player{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px}

    .mode{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:6px}.modepill{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#1d334e;color:#cfe4ff;border:1px solid #355778}
    .modepill.direct{background:#103823;color:#a8f0c4;border-color:#286c46}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    @media(max-width:420px){.grid2{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.footerbar .btn{font-size:11px}}
    @media(min-width:700px){main{padding:24px}.topbar{padding-left:24px;padding-right:24px}}
  
    .studio-hero h1{font-size:clamp(34px,8vw,56px);margin-bottom:8px}
    .studio-lead{font-size:17px;line-height:1.55;color:var(--muted);max-width:720px}
    .simple-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(83,210,124,.35);border-radius:999px;background:rgba(83,210,124,.08);color:var(--green);font-weight:800;font-size:12px}
    .studio-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
    .studio-tile{appearance:none;text-align:left;border:1px solid var(--line);border-radius:18px;padding:18px 15px;background:linear-gradient(180deg,rgba(28,47,73,.96),rgba(18,32,51,.96));color:var(--text);min-height:142px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
    .studio-tile:active{transform:translateY(1px)}
    .studio-tile .ico{font-size:30px;display:block;margin-bottom:10px}
    .studio-tile strong{display:block;font-size:16px;margin-bottom:6px}
    .studio-tile span:last-child{display:block;color:var(--muted);font-size:12px;line-height:1.35}
    .studio-tile.play{grid-column:1/-1;background:linear-gradient(135deg,rgba(24,143,84,.94),rgba(11,98,76,.94));border-color:rgba(112,240,160,.45);min-height:104px}
    .studio-tile.play strong{font-size:21px}
    .studio-trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
    .studio-trust div{border:1px solid var(--line);border-radius:13px;padding:10px;background:rgba(255,255,255,.025);text-align:center}
    .studio-trust strong{display:block;font-size:12px}
    .studio-trust span{font-size:10px;color:var(--muted)}
    .simple-section-title{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 0 10px}
    .simple-option{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text)}
    .simple-option .ico{font-size:24px;width:34px;text-align:center}
    .simple-option .grow strong{display:block}
    .simple-option .grow span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
    .toggle-status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}
    .toggle-status.on{background:rgba(83,210,124,.14);color:var(--green);border:1px solid rgba(83,210,124,.35)}
    .toggle-status.off{background:rgba(255,190,66,.10);color:var(--yellow);border:1px solid rgba(255,190,66,.28)}
    .money-presets{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
    .friendly-card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:17px}
    .friendly-card h3{margin-top:0}
    .advanced-link{width:100%;margin-top:18px;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:14px;padding:12px;font-weight:800}
    @media(min-width:720px){.studio-grid{grid-template-columns:repeat(3,1fr)}.studio-tile.play{grid-column:1/-1}}

  
    .setup-banner{border:1px solid var(--line);border-radius:18px;padding:15px;background:rgba(255,255,255,.025);margin-top:15px}
    .setup-banner.ready{border-color:rgba(83,210,124,.35);background:rgba(83,210,124,.06)}
    .setup-banner.warn{border-color:rgba(255,190,66,.30);background:rgba(255,190,66,.05)}
    .setup-head{display:flex;align-items:center;gap:11px}
    .setup-dot{width:12px;height:12px;border-radius:999px;background:var(--yellow);box-shadow:0 0 0 4px rgba(255,190,66,.08)}
    .setup-banner.ready .setup-dot{background:var(--green);box-shadow:0 0 0 4px rgba(83,210,124,.08)}
    .setup-head .grow strong{display:block}
    .setup-head .grow span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
    .library-card{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text)}
    .library-card .ico{font-size:24px;width:36px;text-align:center}
    .library-card .grow{min-width:0}
    .library-card .grow strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .library-card .grow span{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.35}
    .setup-checks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
    .setup-check{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.02)}
    .setup-check strong{display:block;font-size:12px}
    .setup-check span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
    .setup-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}

  
    .backup-hero{border:1px solid rgba(83,210,124,.32);background:linear-gradient(135deg,rgba(83,210,124,.08),rgba(255,255,255,.02));border-radius:18px;padding:16px}
    .backup-hero.unprotected{border-color:rgba(255,190,66,.30);background:linear-gradient(135deg,rgba(255,190,66,.06),rgba(255,255,255,.02))}
    .backup-stat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
    .backup-stat>div{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.025)}
    .backup-stat strong{display:block;font-size:13px}
    .backup-stat span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
    .restore-item{border:1px solid var(--line);border-radius:15px;padding:13px;background:var(--panel)}
    .restore-item .title{font-weight:800}
    .restore-item .meta{color:var(--muted);font-size:11px;margin-top:4px}
    .restore-item .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
    .progress-wrap{border:1px solid var(--line);border-radius:14px;padding:13px;background:rgba(255,255,255,.025)}
    .progress-line{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:9px}
    .progress-line span{display:block;height:100%;background:var(--green);transition:width .2s ease}
    .danger-note{border:1px solid rgba(255,92,92,.32);border-radius:14px;padding:12px;background:rgba(255,92,92,.06)}

  
    .time-card{border:1px solid var(--line);border-radius:17px;padding:15px;background:var(--panel)}
    .time-card .when{font-size:14px;font-weight:900}
    .time-card .what{font-size:18px;font-weight:900;margin-top:3px}
    .time-card .note{font-size:11px;color:var(--muted);margin-top:5px}
    .time-actions{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:13px}
    .time-actions .go{min-height:50px}
    .safety-details{margin-top:12px;border:1px dashed var(--line);border-radius:14px;padding:11px;color:var(--muted)}
    .safety-details summary{cursor:pointer;font-weight:800;color:var(--muted)}

  
    .play-hero{border:1px solid rgba(83,210,124,.36);border-radius:20px;padding:18px;background:linear-gradient(135deg,rgba(30,150,90,.12),rgba(255,255,255,.02))}
    .play-button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:76px;border-radius:18px;background:var(--green);color:#07150d;text-decoration:none;font-size:23px;font-weight:1000;border:1px solid rgba(255,255,255,.22);box-shadow:0 14px 30px rgba(0,0,0,.18)}
    .play-button:active{transform:translateY(1px)}
    .profile-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--panel)}
    .profile-card strong{display:block}
    .profile-card span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
    .profile-list{display:grid;gap:9px}
    .profile-choice{width:100%;display:flex;gap:11px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--panel);color:var(--text)}
    .profile-choice .grow{min-width:0}
    .profile-choice strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .profile-choice span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    .launch-status{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;border:1px solid rgba(83,210,124,.32);background:rgba(83,210,124,.07);font-weight:900;font-size:11px;color:var(--green)}

  
    .country-card{width:100%;display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);border-radius:16px;padding:15px;background:var(--panel);color:var(--text)}
    .country-card .flag{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.05);font-size:20px;font-weight:900}
    .country-card .grow,.career-simple .grow{min-width:0}

  async function undoLastCareerChange(){
    if(state.kind!=="career"||!state.fileHandle||!state.direct){alert("Open this career through My Career before using Quick Undo.");return}
    const items=await getCareerHistory(state.fileName);
    if(!items.length){alert("There are no recent SWOS Studio career changes to undo.");return}
    const last=items[0];
    if(!confirm(`Undo the last Studio change?\n\n${last.label}\n\nThis restores the career file to how it was immediately before that change.`))return;
    try{
      const previous=base64ToBytes(last.beforeData);
      if(previous.length!==CAREER_FILE_SIZE)throw new Error("Stored undo copy has the wrong career-file size.");
      if(state.fileHandle.requestPermission){
        const perm=await state.fileHandle.requestPermission({mode:"readwrite"});
        if(perm!=="granted")throw new Error("Write permission was not granted.")
      }
      const currentFile=await state.fileHandle.getFile();
      const currentBytes=new Uint8Array(await currentFile.arrayBuffer());
      if(currentBytes.length!==CAREER_FILE_SIZE)throw new Error("Current career file has an unexpected size.");

      const writable=await state.fileHandle.createWritable();
      await writable.write(previous);
      await writable.close();

      const checkFile=await state.fileHandle.getFile();
      const check=new Uint8Array(await checkFile.arrayBuffer());
      if(!byteEqual(check,previous))throw new Error("Undo write verification did not match.");

      items.shift();

      state.bytes=previous.slice();

    }catch(e){alert(`Quick Undo failed: ${e.message}`)}

  function parseMagicCollection(xmlText){
    const doc=new DOMParser().parseFromString(xmlText,"application/xml");

    const games=[...doc.querySelectorAll("game")].map((g,i)=>{
      const title=(g.querySelector("title")?.textContent||g.getAttribute("title")||`Game ${i+1}`).trim();

      return{title,gameId:id}
    }).filter(x=>x.gameId);
    if(!games.length)throw new Error("No Magic DOSBox game profiles with IDs were found in that XML file.");

  async function openSimple(kind,purpose){
    state.simplePurpose=purpose;

    if(directoryApiAvailable&&(kind==="career"||kind==="team")){
      const cacheKey=kind==="career"?CAREER_LIBRARY_CACHE:DATABASE_LIBRARY_CACHE;
      const cached=await loadLibraryCache(cacheKey);

      if(cached.length){
        state.libraryItems=cached;
        state.view=kind==="career"?"careerLibrary":"databaseLibrary";
        state.message=null;
        render();
        window.scrollTo(0,0);

        // If this browser session still has permission, refresh silently in the background.
        if(setup.permission==="granted"&&setup.info?.looksValid){
          if(kind==="career")loadCareerLibraryDetails();else loadDatabaseLibraryDetails();
        }
        return;
      }

      // First use: no cache exists yet, so connect SWOS and build the library once.
      const ok=await ensureGameFolder();
      if(ok){
        setup.info=await scanGameFolder(setup.handle);
        state.libraryItems=[];
        state.view=kind==="career"?"careerLibrary":"databaseLibrary";
        state.message=null;
        render();
        if(kind==="career")loadCareerLibraryDetails();else loadDatabaseLibraryDetails();
        window.scrollTo(0,0);
        return
      }
    }

    if(directoryApiAvailable&&kind==="exe"){
      const ok=await ensureGameFolder();
      if(ok){
        setup.info=await scanGameFolder(setup.handle);
        const entry=setup.info.preferredExe;
        if(entry){const file=await entry.handle.getFile();await loadFile(file,entry.handle,false,"exe");return}
      }
    }

    if(directApiAvailable)openDirect(kind);else fileInput.click()
  }

  async function reconnectLibrary(kind){
    const ok=await ensureGameFolder();
    if(!ok)return false;
    setup.info=await scanGameFolder(setup.handle);
    if(kind==="career")await loadCareerLibraryDetails();else await loadDatabaseLibraryDetails();
    return true
  }

    }

    try{const file=await entry.handle.getFile();state.simplePurpose="career";await loadFile(file,entry.handle,true,"career")}
    catch(e){alert(`Could not open this career: ${e.message}`)}
  }

    }
    const entry=setup.info.teamFiles.find(x=>x.name===name);
    if(!entry){alert("That database is no longer in GAME/DATA. Tap Refresh to update the list.");return}

  async function openActiveCareer(goPlay=false){
    const meta=activeCareer.meta;
    if(!meta?.fileName){alert("No active career is remembered yet. Open My Career first.");return false}
    if(!await ensureGameFolder())return false;
    setup.info=await scanGameFolder(setup.handle);
    const entry=setup.info.careers.find(x=>x.name===meta.fileName);
    if(!entry){
      alert("SWOS Studio cannot find the remembered career in GAME. Open My Career and choose it again.");
      return false
    }
    try{
      const file=await entry.handle.getFile();
      state.simplePurpose="career";
      await loadFile(file,entry.handle,true,"career");
      if(goPlay){state.view="play";state.message=null;render();window.scrollTo(0,0)}
      return true
    }catch(e){alert(`Could not open the active career: ${e.message}`);return false}
  }

  }

  function countryInitials(name){
    const words=String(name||"?").split(/\s+/).filter(Boolean);
    if(!words.length)return"?";
    if(words.length===1)return words[0].slice(0,2).toUpperCase();
    return(words[0][0]+words[1][0]).toUpperCase()
  }
  function teamDatabaseCountry(bytes){
    try{
      const count=(bytes[0]<<8)|bytes[1];
      if(!count)return{code:null,name:"Unknown database"};
      const code=bytes[2];
      return{code,name:nationalityNames[code]||`Country ${code}`}
    }catch(e){return{code:null,name:"Unknown database"}}
  }

  async function databaseSummary(entry){
    try{
      const f=await entry.handle.getFile();
      const head=new Uint8Array(await f.slice(0,HEADER_SIZE+Math.min(2,3)*TEAM_RECORD_SIZE).arrayBuffer());
      if(head.length<3)throw new Error("File is too small.");
      const count=(head[0]<<8)|head[1];
      if(count<1)throw new Error("Header reports zero teams.");
      const expected=HEADER_SIZE+count*TEAM_RECORD_SIZE;
      if(f.size!==expected)throw new Error(`Expected ${expected.toLocaleString()} bytes, found ${f.size.toLocaleString()}.`);
      const country=teamDatabaseCountry(head),sample=[];
      for(let i=0;i<Math.min(2,count);i++){const o=HEADER_SIZE+i*TEAM_RECORD_SIZE,n=readText(head,o+T.name,T.nameLength);if(n)sample.push(n)}
      return{name:entry.name,valid:true,count,sample,countryCode:country.code,countryName:country.name,handle:entry.handle,modified:f.lastModified}
    }catch(e){return{name:entry.name,valid:false,reason:e.message,handle:entry.handle}}
  }

  async function openDirect(expectedKind){try{
    const options={multiple:false,id:expectedKind==="career"?"swos-career-game":expectedKind==="exe"?"swos-exe-game":expectedKind==="pool"?"swos-pool-data":"swos-team-data"};
    if(expectedKind==="career")options.types=[{description:"SWOS career save",accept:{"application/octet-stream":[".car"]}}];if(expectedKind==="exe")options.types=[{description:"SWOS DOS executable",accept:{"application/octet-stream":[".exe"]}}];if(expectedKind==="pool")options.types=[{description:"SWOS foreign transfer pool",accept:{"application/octet-stream":[".dat"]}}];
    const [handle]=await window.showOpenFilePicker(options),file=await handle.getFile();
    if(expectedKind==="career"&&!file.name.toLowerCase().endsWith(".car"))throw new Error("Choose a .CAR career save from the main SWOS GAME folder.");
    if(expectedKind==="exe"&&!file.name.toLowerCase().endsWith(".exe"))throw new Error("Choose SWSENGPP.EXE (or a previously patched SWOS EXE) from the main SWOS GAME folder.");
    if(expectedKind==="team"&&(file.name.toLowerCase().endsWith(".car")||file.name.toLowerCase().endsWith(".exe")||file.name.toLowerCase()==="poolplyr.dat"))throw new Error("Choose a TEAM.* database from SWOS GAME/DATA.");if(expectedKind==="pool"&&file.name.toLowerCase()!=="poolplyr.dat")throw new Error("Choose POOLPLYR.DAT from SWOS GAME/DATA.");
    await loadFile(file,handle,expectedKind==="exe"?false:true,expectedKind)
  }catch(e){if(e&&e.name!=="AbortError"){state.message=`Direct open failed: ${e.message}`;render()}}}

  async function loadFile(file,handle,direct,expectedKind=null){const bytes=new Uint8Array(await file.arrayBuffer());state.bytes=bytes;state.openingOriginal=bytes.slice();state.savedBaseline=bytes.slice();state.fileName=file.name;state.fileHandle=handle||null;state.direct=!!direct;state.changed=new Set();state.filter="all";state.query="";state.playerQuery="";state.poolQuery="";state.sourceQuery="";state.playerClipboard=null;state.db=null;state.career=null;state.pool=null;state.poolSource=null;state.exe=null;
    const lower=file.name.toLowerCase();if(lower.endsWith(".exe")){state.kind="exe";parseExe();state.direct=false;state.view="exe";state.message=state.simplePurpose==="enhancements"?"Game enhancements are ready.":`Loaded SWOS executable in safe-copy mode. The original file will not be overwritten automatically.`;}else if(lower.endsWith(".car")){validateCareer(bytes);state.kind="career";parseCareer();state.view="career";state.message=state.simplePurpose==="career"?`Career loaded successfully.`:`Loaded career successfully${direct?' in direct-save mode':''}.`;await saveActiveCareerMeta();}else if(lower==="poolplyr.dat"||bytes.length===POOL_FILE_SIZE){validatePool(bytes);state.kind="pool";parsePool();state.view="pool";state.message=`Loaded all ${POOL_COUNT} foreign-transfer pool entries${direct?' in direct-save mode':''}.`;}else{try{validateTeam(bytes);state.kind="team";parseDb();state.view="teams";state.message=state.simplePurpose==="kits"?`Choose the club whose kit you want to change.`:state.simplePurpose==="players"?`Choose a team or find a player.`:`Loaded ${state.db.count} teams successfully${direct?' in direct-save mode':''}.`;}catch(teamErr){try{validateCareer(bytes);state.kind="career";parseCareer();state.view="career";state.message=`Loaded career successfully${direct?' in direct-save mode':''}.`;await saveActiveCareerMeta();}catch(carErr){try{validatePool(bytes);state.kind="pool";parsePool();state.view="pool";state.message=`Loaded all ${POOL_COUNT} foreign-transfer pool entries${direct?' in direct-save mode':''}.`;}catch(poolErr){throw new Error(`Unsupported SWOS file. TEAM check: ${teamErr.message} Career check: ${carErr.message} Pool check: ${poolErr.message}`)}}}}render();window.scrollTo(0,0)}

  async function loadPoolSourceTeam(){try{let file;if(directApiAvailable){const [h]=await window.showOpenFilePicker({multiple:false,id:"swos-pool-source-team"});file=await h.getFile()}else{file=await new Promise((resolve,reject)=>{const i=document.createElement("input");i.type="file";i.onchange=()=>i.files[0]?resolve(i.files[0]):reject(new Error("No file chosen"));i.click()})}const bytes=new Uint8Array(await file.arrayBuffer());state.poolSource=parseTeamFileBytes(bytes,file.name);state.sourceQuery="";const s=sourcePoolStats();state.message=`Loaded ${file.name}: ${state.poolSource.count} teams. ${s.linked} pool entries reference this TEAM file; ${s.stale} currently differ.`;render()}catch(e){if(e&&e.name!=="AbortError")alert(`Could not load TEAM source: ${e.message}`)}}
  function renderPool(){const q=state.poolQuery.trim().toLowerCase(),posFilter=state.filter;const matching=state.pool.records.filter(r=>(!q||r.player.name.toLowerCase().includes(q)||r.teamName.toLowerCase().includes(q))&&(posFilter==="all"||r.player.position===posFilter));const shown=matching.slice(0,250),stats=sourcePoolStats();const chip=(code,label)=>`<button class="chip ${state.filter===code?'active':''}" data-poolfilter="${code}">${esc(label)}</button>`;main.innerHTML=`${state.message?`<div class="notice section-gap">${esc(state.message)}</div>`:""}<div class="notice info section-gap"><strong>FOREIGN TRANSFER MARKET:</strong> <code>POOLPLYR.DAT</code> belongs in <code>GAME/DATA</code>. Changes are visible in existing careers when SWOS reads the foreign-market list.</div>

  function money(v){const sign=v<0?"-":"";return `${sign}£${Math.abs(v).toLocaleString("en-GB")}`}
  function careerBaseName(name){return String(name||"CAREER").replace(/\.car$/i,"").toUpperCase().slice(0,8)}
  function cleanCareerBaseName(value){return String(value||"").toUpperCase().replace(/[^A-Z0-9_-]/g,"").slice(0,8)}
  function validCareerBaseName(value){return /^[A-Z0-9_-]{1,8}$/.test(value)}
  async function writeAndVerifyHandle(handle,bytes){
    if(handle.requestPermission){const perm=await handle.requestPermission({mode:"readwrite"});if(perm!=="granted")throw new Error("Write permission was not granted.")}
    const writable=await handle.createWritable();await writable.write(bytes);await writable.close();
    const f=await handle.getFile(),check=new Uint8Array(await f.arrayBuffer());if(!byteEqual(check,bytes))throw new Error("The renamed career was written, but verification did not match. Keep your original career and do not use the new file.");
    return f;
  }
  function suggestedCareerCopyBase(){
    const base=careerBaseName(state.fileName||"CAREER");
    const stem=base.slice(0,7);
    for(const suffix of ["2","B","C","D","E","F","G","H","I","J"]){
      const candidate=cleanCareerBaseName(`${stem}${suffix}`);
      if(candidate&&candidate!==base)return candidate
    }
    return cleanCareerBaseName(`COPY${Date.now().toString().slice(-4)}`)
  }

  async function createCareerCopy(requestedBase,useCopy){
    if(state.kind!=="career"||!state.bytes)return false;
    const base=cleanCareerBaseName(requestedBase),newName=`${base}.CAR`;
    if(!validCareerBaseName(base)){alert("Use 1–8 letters, numbers, hyphens or underscores.");return false}
    if(newName.toUpperCase()===String(state.fileName||"").toUpperCase()){alert("Choose a different name from the current career.");return false}
    try{
      validateCareer(state.bytes);
      if(state.bytes.length!==CAREER_FILE_SIZE)throw new Error("Career file size is unexpected.");
      const ok=await ensureGameFolder();
      if(!ok)return false;
      if(setup.handle.requestPermission){
        const perm=await setup.handle.requestPermission({mode:"readwrite"});
        if(perm!=="granted")throw new Error("Write permission was not granted.")
      }
      try{
        await setup.handle.getFileHandle(newName);
        alert(`${newName} already exists in your SWOS GAME folder. Choose another name so Studio does not overwrite a career.`);
        return false
      }catch(e){if(e.name!=="NotFoundError")throw e}

      const newHandle=await setup.handle.getFileHandle(newName,{create:true});
      const written=await writeAndVerifyHandle(newHandle,state.bytes);

      // Re-scan so the copy immediately exists in My Career.
      setup.info=await scanGameFolder(setup.handle);
      state.libraryItems=[];

      if(useCopy){
        state.simplePurpose="career";
        await loadFile(written,newHandle,true,"career");
        state.message=`Created ${written.name} safely and switched to the new copy. Your original career is unchanged.`;
        await saveActiveCareerMeta();
        state.view="career";
        render();window.scrollTo(0,0)
      }else{
        state.view="career";
        state.message=`Created ${written.name} safely in the SWOS GAME folder. You are still editing ${state.fileName}.`;
        render();window.scrollTo(0,0)
      }
      return true
    }catch(e){
      alert(`Could not create the career copy: ${e.message}`);
      return false
    }
  }

  async function renameCareerFile(requestedBase){
    if(state.kind!=="career"||!state.bytes)return;
    const base=cleanCareerBaseName(requestedBase),newName=`${base}.CAR`,oldName=state.fileName;
    if(!validCareerBaseName(base))return alert("Use 1–8 letters, numbers, hyphens or underscores for the career filename.");
    if(newName.toUpperCase()===String(oldName||"").toUpperCase())return alert("Choose a different career filename.");
    try{
      validateCareer(state.bytes);if(state.bytes.length!==state.openingOriginal.length)throw new Error("Rename blocked: file length changed.");
      let newHandle=null;
      if(saveAsApiAvailable){
        const opts={id:"swos-career-game",suggestedName:newName,types:[{description:"SWOS career save",accept:{"application/octet-stream":[".car"]}}]};
        if(state.fileHandle)opts.startIn=state.fileHandle;
        newHandle=await window.showSaveFilePicker(opts);
      }else if(directoryApiAvailable){
        const dir=await window.showDirectoryPicker({id:"swos-career-game",mode:"readwrite"});
        let exists=false;try{await dir.getFileHandle(newName);exists=true}catch(e){if(e.name!=="NotFoundError")throw e}
        if(exists&&!confirm(`${newName} already exists in that folder. Overwrite it?`))return;
        newHandle=await dir.getFileHandle(newName,{create:true});
      }else{
        download(state.bytes,newName);state.message=`Created ${newName} as a download. Your browser did not offer direct Save As access, so move it into the SWOS GAME folder manually. ${oldName} was not changed.`;render();window.scrollTo(0,0);return;
      }
      if(!/\.car$/i.test(newHandle.name))throw new Error("The new filename must end in .CAR.");
      const chosenBase=newHandle.name.replace(/\.car$/i,"").toUpperCase();if(!validCareerBaseName(chosenBase))throw new Error("SWOS career filenames should use 1–8 letters, numbers, hyphens or underscores before .CAR.");
      if(state.fileHandle&&state.fileHandle.isSameEntry&&await state.fileHandle.isSameEntry(newHandle))throw new Error("That is the same file you already opened. Choose a different filename.");
      const written=await writeAndVerifyHandle(newHandle,state.bytes);
      persistSafetyBackup();state.fileHandle=newHandle;state.fileName=written.name;state.direct=true;state.savedBaseline=state.bytes.slice();state.changed=new Set();parseCareer();
      state.message=`Career renamed safely: ${oldName} → ${state.fileName}. Keep the new .CAR in the main SWOS GAME folder so it appears in Load Old Competition. The old file was kept as a backup. ${state.fileName} is now the active career for future direct saves.`;render();window.scrollTo(0,0);
    }catch(e){if(e&&e.name==="AbortError")return;alert(`Career rename failed: ${e.message}\n\nYour original career has not been removed.`)}
  }

    <div class="notice section-gap">When you change an ability, the app changes only its real 0–7 level and preserves SWOS’s hidden 8–15 flag. Position and appearance share one byte; the three unknown low bits are preserved unchanged.</div>
    <button class="btn btn-green big section-gap" id="savePlayer">Save player changes</button><div class="split-actions section-gap"><button class="btn btn-blue" id="copyPlayer">Copy player data</button><button class="btn btn-blue" id="pastePlayer" ${state.playerClipboard&&state.playerClipboard.kind==="team"?"":"disabled"}>Paste / replace</button></div><button class="btn big section-gap" id="restorePlayer">Restore this slot</button><button class="btn btn-blue big section-gap" id="transferPlayer">Transfer / swap with another club</button>${edited?'<div class="meta" style="text-align:center;margin-top:8px;color:var(--green)">This player already has an edit waiting to be saved/exported.</div>':''}
    <details class="section-gap"><summary>Advanced / raw player record</summary><div class="about section-gap">Record offset: ${p.offset}<br>Nationality: ${hex(p.nationality)}<br>Multipurpose byte: ${hex(p.multi)}<br>Unknown byte 27: ${hex(state.bytes[p.offset+27])}<br>Raw skills: ${p.rawSkills.join(', ')}<br>Value byte: ${hex(p.value)}</div></details>`;
    const name=document.getElementById("nameInput"),counter=document.getElementById("counter"),save=document.getElementById("savePlayer");document.querySelectorAll("[data-skill]").forEach(r=>r.oninput=()=>document.getElementById(`skillValue${r.dataset.skill}`).textContent=r.value);document.getElementById("preset7").onclick=()=>applySkillPreset(7);document.getElementById("preset4").onclick=()=>applySkillPreset(4);document.getElementById("preset0").onclick=()=>applySkillPreset(0);
    function formValid(){const v=name.value.toUpperCase();if(name.value!==v)name.value=v;const bad=/[^\x20-\x7E]/.test(v),too=v.length>23,shirt=Number(document.getElementById("shirtInput").value),badShirt=!Number.isInteger(shirt)||shirt<0||shirt>99;counter.textContent=`${v.length}/23${bad?' · plain ASCII only':''}${too?' · TOO LONG':''}${badShirt?' · shirt 0–99':''}`;counter.style.color=(bad||too||badShirt)?'var(--red)':'var(--muted)';save.disabled=bad||too||badShirt}name.oninput=formValid;document.getElementById("shirtInput").oninput=formValid;formValid();
    save.onclick=()=>{try{const levels=[...document.querySelectorAll("[data-skill]")].map(r=>Number(r.value));writePlayer(p,{name:name.value,nationality:Number(document.getElementById("nationalityInput").value),shirt:Number(document.getElementById("shirtInput").value),position:Number(document.getElementById("positionInput").value),appearance:Number(document.getElementById("appearanceInput").value),value:Number(document.getElementById("valueInput").value),levels});refreshTeam(team.index);state.changed.add(key);state.view="team";state.message=null;render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("copyPlayer").onclick=()=>{copyKnownPlayerData(p,`${p.name} · ${team.name}`,"team");state.message=`Copied known player data from ${p.name}. Open another database player and use Paste / replace.`;render()};document.getElementById("pastePlayer").onclick=()=>{try{if(!confirm(`Replace the known football data in this slot (${p.name}) with ${state.playerClipboard?.sourceLabel||"the copied player"}?\n\nThe final 5 unknown/reserved bytes in this slot are preserved.`))return;pasteKnownPlayerData(p,"team");refreshTeam(team.index);state.changed.add(key);state.message=`Replaced ${p.name} with copied player data from ${state.playerClipboard.sourceLabel}.`;state.view="team";render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("restorePlayer").onclick=()=>{try{if(!confirm(`Restore this player slot to its state at the last save/open?`))return;restorePlayerSlot(p);refreshTeam(team.index);state.changed.delete(key);state.message="Player slot restored from the last saved baseline.";state.view="team";render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("transferPlayer").onclick=()=>{state.view="transfer";state.message=null;render();window.scrollTo(0,0)};document.getElementById("backTeam").onclick=()=>{state.view="team";state.message=null;render();window.scrollTo(0,0)}}

  function renderCareerPlayer(){const p=state.career.players[state.careerPlayerIndex],orderPos=state.career.squadOrder.indexOf(p.index),role=orderPos<0?"Unused":orderPos<11?"Starting XI":orderPos<16?"Substitute":"Reserve",key=`career:player:${p.index}`,edited=state.changed.has(key);main.innerHTML=`<button class="btn back" id="backCareer">← My career players</button><div class="simple-pill">✏️ Career Player</div><h2>${esc(p.name)}</h2>
    <div class="scope-banner career"><span class="scope-kicker">🏆 THIS CAREER ONLY</span><strong>${esc(role)} · edit the copy stored in this career.</strong><span>The SWOS Database and other careers are not changed.</span></div>
    <div class="card section-gap stack"><div class="field"><label>Player name — max 23 ASCII characters</label><input id="nameInput" value="${esc(p.name)}" maxlength="40" autocomplete="off" spellcheck="false"/><div class="counter" id="counter">${p.name.length}/23</div></div>
    <div class="grid2"><div class="field"><label>Nationality</label><select id="nationalityInput">${nationalityOptions(p.nationality)}</select></div><div class="field"><label>Shirt number</label><input id="shirtInput" type="number" min="0" max="99" value="${p.shirt}"/></div></div>
    <div class="grid2"><div class="field"><label>Position</label><select id="positionInput">${positionOptions(p.position)}</select></div><div class="field"><label>Appearance</label><select id="appearanceInput">${appearanceOptions(p.appearance)}</select></div></div>
    <div class="field"><label>Player value</label><select id="valueInput">${valueOptions(Math.min(p.value,49))}</select></div></div>
    <div class="section-gap"><div class="row"><h3 class="grow">Abilities · true SWOS level 0–7</h3></div><div class="split-actions section-gap"><button class="btn" id="preset7">All 7</button><button class="btn" id="preset4">All 4</button></div><button class="btn" style="width:100%;margin-top:9px" id="preset0">All 0</button><div class="skills section-gap">${skillNames.map((name,i)=>`<div class="skill"><div class="skill-head"><strong>${name}</strong><span class="skill-value" id="skillValue${i}">${p.levels[i]}</span></div><input type="range" min="0" max="7" step="1" value="${p.levels[i]}" data-skill="${i}"/><div class="tiny">Stored raw value now: ${p.rawSkills[i]}${p.rawSkills[i]>=8?' · transfer-filter flag is set':''}</div></div>`).join("")}</div></div>
    <div class="notice section-gap">The editor preserves SWOS's hidden skill flag and unknown bits exactly as it does for database players.</div>
    <button class="btn btn-green big section-gap" id="savePlayer">Save player to this career</button><div class="split-actions section-gap"><button class="btn btn-blue" id="copyPlayer">Copy player data</button><button class="btn btn-blue" id="pastePlayer" ${state.playerClipboard&&state.playerClipboard.kind==="career"?"":"disabled"}>Paste / replace</button></div><button class="btn big section-gap" id="restorePlayer">Restore this career slot</button>${edited?'<div class="meta" style="text-align:center;margin-top:8px;color:var(--green)">This career player already has an edit waiting to be saved/exported.</div>':''}
    <details class="section-gap"><summary>Advanced / raw career player record</summary><div class="about section-gap">Career slot: ${p.index}<br>Record offset: <code>0x${p.offset.toString(16).toUpperCase()}</code><br>Nationality: ${hex(p.nationality)}<br>Multipurpose byte: ${hex(p.multi)}<br>Unknown byte 27: ${hex(state.bytes[p.offset+27])}<br>Raw skills: ${p.rawSkills.join(', ')}<br>Value byte: ${hex(p.value)}</div></details>`;
    const name=document.getElementById("nameInput"),counter=document.getElementById("counter"),save=document.getElementById("savePlayer");document.querySelectorAll("[data-skill]").forEach(r=>r.oninput=()=>document.getElementById(`skillValue${r.dataset.skill}`).textContent=r.value);document.getElementById("preset7").onclick=()=>applySkillPreset(7);document.getElementById("preset4").onclick=()=>applySkillPreset(4);document.getElementById("preset0").onclick=()=>applySkillPreset(0);
    function formValid(){const v=name.value.toUpperCase();if(name.value!==v)name.value=v;const bad=/[^\x20-\x7E]/.test(v),too=v.length>23,shirt=Number(document.getElementById("shirtInput").value),badShirt=!Number.isInteger(shirt)||shirt<0||shirt>99;counter.textContent=`${v.length}/23${bad?' · plain ASCII only':''}${too?' · TOO LONG':''}${badShirt?' · shirt 0–99':''}`;counter.style.color=(bad||too||badShirt)?'var(--red)':'var(--muted)';save.disabled=bad||too||badShirt}name.oninput=formValid;document.getElementById("shirtInput").oninput=formValid;formValid();
    save.onclick=async()=>{try{const playerName=name.value.toUpperCase(),levels=[...document.querySelectorAll("[data-skill]")].map(r=>Number(r.value));writePlayer(p,{name:name.value,nationality:Number(document.getElementById("nationalityInput").value),shirt:Number(document.getElementById("shirtInput").value),position:Number(document.getElementById("positionInput").value),appearance:Number(document.getElementById("appearanceInput").value),value:Number(document.getElementById("valueInput").value),levels});state.changed.add(key);parseCareer();await saveSimpleDirect(`${playerName} updated in this career only.`,"careerPlayers")}catch(e){alert(e.message)}};document.getElementById("copyPlayer").onclick=()=>{copyKnownPlayerData(p,`${p.name} · ${state.career.club} career`,"career");state.message=`Copied known career-player data from ${p.name}. Open another career player and use Paste / replace.`;render()};document.getElementById("pastePlayer").onclick=()=>{try{if(!confirm(`Replace the known football data in this career slot (${p.name}) with ${state.playerClipboard?.sourceLabel||"the copied player"}?\n\nCareer-only trailing bytes in the destination slot are preserved.`))return;pasteKnownPlayerData(p,"career");state.changed.add(key);parseCareer();state.message=`Career player data replaced from ${state.playerClipboard.sourceLabel}.`;state.view="career";render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("restorePlayer").onclick=()=>{try{if(!confirm("Restore this career player slot to its state at the last save/open?"))return;restorePlayerSlot(p);state.changed.delete(key);parseCareer();state.message="Career player slot restored from the last saved baseline.";state.view="career";render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("backCareer").onclick=()=>{state.view=state.simplePurpose==="career"?"careerPlayers":"career";state.message=null;render();window.scrollTo(0,0)}}

  function download(bytes,name){const copy=bytes.slice(),blob=new Blob([copy],{type:"application/octet-stream"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function exportCopy(){if(!state.bytes)return;try{validateCurrent();if(state.bytes.length!==state.openingOriginal.length)throw new Error("Export blocked: file length changed.");download(state.bytes,state.fileName);state.message=`Exported ${state.fileName} as a copy.`;state.view=state.kind==="career"?"career":state.kind==="pool"?"pool":state.kind==="exe"?"exe":"teams";render();window.scrollTo(0,0)}catch(e){alert(e.message)}}
  async function saveSimpleDirect(successMessage,returnView){
    if(!state.bytes)return false;
    const historyBefore=state.kind==="career"&&state.savedBaseline?state.savedBaseline.slice():null;
    const historyKeys=state.kind==="career"?[...state.changed]:[];
    if(!state.direct||!state.fileHandle){
      state.message=`${successMessage} The edit is ready, but this file was not opened through the connected SWOS folder. Use the Save button below to export/write it.`;
      render();window.scrollTo(0,0);return false
    }
    try{
      validateCurrent();
      if(state.bytes.length!==state.openingOriginal.length)throw new Error("Save blocked: file length changed.");
      persistSafetyBackup();
      if(state.fileHandle.requestPermission){
        const perm=await state.fileHandle.requestPermission({mode:"readwrite"});
        if(perm!=="granted")throw new Error("Write permission was not granted.")
      }
      const writable=await state.fileHandle.createWritable();
      await writable.write(state.bytes);
      await writable.close();
      const checkFile=await state.fileHandle.getFile();
      const check=new Uint8Array(await checkFile.arrayBuffer());
      if(!byteEqual(check,state.bytes))throw new Error("The file was written but verification did not match.");
      if(state.kind==="career"&&historyBefore&&historyKeys.length){
        await recordCareerHistory(successMessage,historyBefore,historyKeys)
      }
      state.savedBaseline=state.bytes.slice();
      state.changed=new Set();
      parseCurrent();
      if(state.kind==="career")await saveActiveCareerMeta();
      state.view=returnView||(
        state.kind==="career"?"career":
        state.kind==="pool"?"pool":
        state.kind==="exe"?"exe":"teams"
      );
      state.message=`${successMessage} Saved and verified. Restart SWOS / Magic DOSBox to load the change.`;
      render();window.scrollTo(0,0);
      return true
    }catch(e){
      alert(`Save failed: ${e.message}\n\nYour edit is still in SWOS Studio.`);
      return false
    }
  }

  async function saveDirect(){if(state.kind==="exe")return saveExeCopy();if(!state.fileHandle)return exportCopy();try{validateCurrent();if(state.bytes.length!==state.openingOriginal.length)throw new Error("Save blocked: file length changed.");const folderHint=state.kind==="career"?"Career files should be in the main GAME folder.":state.kind==="pool"?"POOLPLYR.DAT should be in GAME/DATA.":state.kind==="exe"?"SWOS EXE files should be in the main GAME folder.":"TEAM.* files should be in GAME/DATA.";if(!confirm(`Save changes directly over ${state.fileName} in its current folder?\n\n${folderHint}\nClose SWOS first. The app will keep an opening backup.`))return;const backed=persistSafetyBackup();if(state.fileHandle.requestPermission){const perm=await state.fileHandle.requestPermission({mode:"readwrite"});if(perm!=="granted")throw new Error("Write permission was not granted.")}
      const writable=await state.fileHandle.createWritable();await writable.write(state.bytes);await writable.close();const checkFile=await state.fileHandle.getFile(),check=new Uint8Array(await checkFile.arrayBuffer());if(!byteEqual(check,state.bytes))throw new Error("The file was written but verification did not match. Restore from your backup before using SWOS.");state.savedBaseline=state.bytes.slice();state.changed=new Set();parseCurrent();state.view=state.kind==="career"?"career":state.kind==="pool"?"pool":state.kind==="exe"?"exe":"teams";state.message=`Saved directly over ${state.fileName} and verified it byte-for-byte.${backed?' Opening backup stored in this browser.':''} Restart SWOS / Magic DOSBox to load the changes.`;render();window.scrollTo(0,0)}catch(e){alert(`Direct save failed: ${e.message}\n\nYour in-app edits are still here. You can use Export a copy instead.`)}}

  fileInput.onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;try{await loadFile(f,null,false)}catch(err){state={...state,bytes:null,openingOriginal:null,savedBaseline:null,fileHandle:null,direct:false,kind:null,db:null,career:null,pool:null,poolSource:null,exe:null,view:"landing",message:err.message};render()}};
  document.getElementById("brandHome").onclick=()=>{if(state.simplePurpose){state.view="landing"}else if(!state.kind){state.view="landing"}else{state.view=state.kind==="career"?"career":state.kind==="pool"?"pool":state.kind==="exe"?"exe":"teams"}state.message=null;render();window.scrollTo(0,0)};
  primarySaveBtn.onclick=()=>state.kind==="exe"?saveExeCopy():state.direct?saveDirect():exportCopy();
  document.getElementById("backupBtn").onclick=()=>{if(state.openingOriginal)download(state.openingOriginal,`${state.fileName}.opening-backup`)};
  undoBtn.onclick=()=>{if(!state.savedBaseline||state.changed.size===0)return;if(!confirm("Undo edits made since the last direct save (or since opening the file)?"))return;state.bytes=state.savedBaseline.slice();state.changed=new Set();parseCurrent();state.view=state.kind==="career"?"career":state.kind==="pool"?"pool":state.kind==="exe"?"exe":"teams";state.message="Pending edits were undone.";render();window.scrollTo(0,0)};
  render();
  (async()=>{await Promise.all([refreshSetup(false),loadLauncherProfile(),loadActiveCareer()]);if(state.view==="landing")render()})();
})();

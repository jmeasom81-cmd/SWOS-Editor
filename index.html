<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>SWOS Editor v0.9</title>
  <style>
    :root{
      --bg:#050a12;--panel:#0d1828;--panel2:#132238;--line:#263d5c;
      --text:#f5f7fb;--muted:#9db0c8;--yellow:#f5d547;--green:#42d184;
      --red:#ff6b6b;--blue:#58a6ff;--shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(circle at 50% -20%,#153660 0,transparent 45%),
      linear-gradient(#07111f,#050a12 55%);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;padding-bottom:94px}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.94);
      backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}
    .brand{font-weight:900;letter-spacing:.08em;color:var(--yellow);font-size:18px}
    .sub{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.35}
    main{max-width:760px;margin:0 auto;padding:16px}
    .hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
    .eyebrow{font-size:11px;font-weight:900;color:var(--green);letter-spacing:.14em;text-transform:uppercase}
    h1,h2,h3{margin:0} h1{font-size:36px;letter-spacing:.03em} h2{font-size:24px}
    h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
    p{line-height:1.5}
    .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
      border-radius:14px;padding:15px;box-shadow:var(--shadow)}
    .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);min-height:48px;
      border-radius:11px;padding:11px 14px;font-weight:800}
    .btn:active{transform:translateY(1px)} .btn-primary{background:var(--yellow);color:#14190a;border-color:#fff3a4}
    .btn-green{background:var(--green);color:#052012;border-color:#8effbc}
    .btn-blue{background:#173b63;color:#dbeeff;border-color:#33689e}
    .btn-danger{border-color:#6e3138;background:#2a151a;color:#ffbec4}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .big{min-height:62px;font-size:17px;width:100%}
    .row{display:flex;gap:9px;align-items:center}.grow{flex:1}.stack{display:grid;gap:10px}
    .search,.field input,.field select{width:100%;height:50px;border-radius:11px;border:1px solid var(--line);
      background:#07111f;color:var(--text);padding:0 14px;outline:none}
    .search:focus,.field input:focus,.field select:focus{border-color:var(--yellow)}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}
    .chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);
      border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800}
    .chip.active{background:var(--yellow);color:#111;border-color:#fff0a0}
    .team{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
      background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px}
    .team-name{font-weight:900;font-size:16px}.meta{font-size:12px;color:var(--muted);margin-top:3px}
    .badge{background:var(--green);color:#041c0f;padding:5px 8px;border-radius:8px;font-size:10px;font-weight:900}
    .badge-blue{background:#2a5d91;color:#e3f2ff}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 18px}
    .fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px}
    .fact small{display:block;color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:.08em}
    .fact strong{display:block;margin-top:4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .player{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:var(--panel);color:var(--text);
      border:1px solid var(--line);border-radius:12px;padding:10px}.player.edited{border-color:var(--green)}
    .shirt{width:42px;height:42px;display:grid;place-items:center;background:#172a45;border:1px solid #365477;border-radius:9px;font-weight:900}
    .player-main{min-width:0;flex:1}.player-name{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .notice{border:1px solid rgba(66,209,132,.55);background:rgba(66,209,132,.08);border-radius:11px;padding:12px;font-size:13px;line-height:1.45}
    .error{border-color:#7b343b;background:#2b1519;color:#ffd0d4}.info{border-color:#345f86;background:#10243b}
    .field label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;display:block;margin-bottom:7px}
    .counter{font-size:11px;color:var(--muted);margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .skills{display:grid;gap:10px}.skill{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px}
    .skill-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.skill strong{font-size:13px}
    .skill-value{font-weight:900;color:var(--yellow);min-width:34px;text-align:right}
    input[type=range]{width:100%;accent-color:var(--yellow);margin-top:8px}
    .tiny{font-size:10px;color:var(--muted);line-height:1.4}
    .footerbar{position:fixed;left:0;right:0;bottom:0;z-index:25;border-top:1px solid var(--line);
      background:rgba(7,17,31,.96);backdrop-filter:blur(10px);padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
    .footerbar .inner{max-width:760px;margin:0 auto;display:flex;gap:8px}.footerbar .btn{flex:1;min-width:0;padding-left:8px;padding-right:8px;font-size:12px}
    .hidden{display:none!important} details{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}
    summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:800} code{color:#d9e9ff}.about{font-size:12px;color:var(--muted)}
    .section-gap{margin-top:18px}.back{margin-bottom:14px}.empty{text-align:center;color:var(--muted);padding:26px}
    .kit-preview{display:grid;place-items:center;gap:5px;min-height:150px;background:#07111f;border:1px solid var(--line);border-radius:12px;padding:12px}
    .kit-shirt{width:92px;height:68px;border-radius:16px 16px 10px 10px;border:2px solid rgba(255,255,255,.16);clip-path:polygon(17% 0,34% 9%,66% 9%,83% 0,100% 19%,85% 36%,78% 27%,78% 100%,22% 100%,22% 27%,15% 36%,0 19%)}
    .kit-shorts{width:57px;height:32px;border:2px solid rgba(255,255,255,.16);clip-path:polygon(0 0,100% 0,91% 100%,55% 100%,50% 72%,45% 100%,9% 100%)}
    .kit-socks{display:flex;gap:10px}.kit-sock{width:18px;height:35px;border:2px solid rgba(255,255,255,.16);border-radius:2px 2px 7px 7px}
    .order-row{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px}
    .order-no{width:35px;height:35px;display:grid;place-items:center;border-radius:8px;background:#172a45;font-weight:900}
    .role-badge{font-size:9px;font-weight:900;border-radius:999px;padding:4px 7px;background:#213a59;color:#dbeaff;white-space:nowrap}
    .move-buttons{display:flex;gap:5px}.move-buttons .btn{min-height:36px;padding:5px 9px}
    .split-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .mode{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:6px}.modepill{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#1d334e;color:#cfe4ff;border:1px solid #355778}
    .modepill.direct{background:#103823;color:#a8f0c4;border-color:#286c46}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    @media(max-width:420px){.grid2{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.footerbar .btn{font-size:11px}}
    @media(min-width:700px){main{padding:24px}.topbar{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
<div id="app" class="app">
  <div id="topbar" class="topbar hidden">
    <div class="brand" id="brandHome">SWOS EDITOR <span style="font-size:10px;color:var(--green)">v0.9</span></div>
    <div class="sub" id="fileMeta"></div>
    <div class="mode" id="modeLine"></div>
  </div>
  <main id="main"></main>
  <div id="footerbar" class="footerbar hidden"><div class="inner">
    <button class="btn btn-primary" id="primarySaveBtn">Export file</button>
    <button class="btn" id="backupBtn">Backup</button>
    <button class="btn" id="undoBtn">Undo edits</button>
  </div></div>
</div>
<input id="fileInput" type="file" class="hidden" />
<script>
(() => {
  "use strict";
  const TEAM_RECORD_SIZE=684, PLAYER_RECORD_SIZE=38, PLAYERS_PER_TEAM=16, HEADER_SIZE=2, POOL_RECORD_SIZE=58, POOL_COUNT=900, POOL_FILE_SIZE=52200;
  const CAREER_FILE_SIZE=149189;
  const C={club:7,clubLength:16,manager:38,managerLength:24,currentBalance:0xD5DC,previousBalance:0xD5E0,competitionBonus:0xD600,sponsorship:0xD5F8,squadOrder:0xDB60,currentTeam:0xDB80,careerPlayers:0xDBCC,careerPlayerSlots:32};
  const T={name:5,nameLength:19,tactic:24,division:25,homeKit:26,awayKit:31,coach:36,coachLength:24,order:60,players:76};
  const P={nationality:0,shirt:2,name:3,nameLength:23,multi:26,unknown27:27,passing:28,shootHead:29,tackleControl:30,speedFinish:31,value:32};
  const divisions=["Premier","First","Second","Third","Non-League"];
  const formations=["4-4-2","5-4-1","4-5-1","5-3-2","3-5-2","4-3-3","4-2-4","3-4-3","Sweeper","5-2-3","Attack","Defend","User A","User B","User C","User D","User E","User F"];
  const positions=[["Goalkeeper","GK"],["Right Back","RB"],["Left Back","LB"],["Defender","D"],["Right Wing","RW"],["Left Wing","LW"],["Midfielder","M"],["Attacker","A"]];
  const appearances=["White skin / black hair","White skin / blonde hair","Black skin / black hair","Undefined / custom"];
  const kitStyles=["Plain","Colored sleeves","Vertical stripes","Horizontal stripes"];
  const kitColors=[
    {name:"Grey",css:"#b4b4b4"},{name:"White",css:"#ffffff"},{name:"Black",css:"#000000"},
    {name:"Orange",css:"#fc6c00"},{name:"Red",css:"#fc0000"},{name:"Blue",css:"#0000fc"},
    {name:"Brown",css:"#6c0024"},{name:"Light blue",css:"#9090fc"},{name:"Green",css:"#249000"},
    {name:"Yellow",css:"#fcfc00"}
  ];
  const skillNames=["Passing","Shooting","Heading","Tackling","Control","Speed","Finishing"];
  const values=["< £25k","£25k","£30k","£40k","£50k","£65k","£75k","£85k","£100k","£110k","£130k","£150k","£160k","£180k","£200k","£250k","£300k","£350k","£450k","£500k","£550k","£600k","£650k","£700k","£750k","£800k","£850k","£950k","£1m","£1.1m","£1.3m","£1.5m","£1.6m","£1.8m","£1.9m","£2m","£2.25m","£2.75m","£3m","£3.5m","£4.5m","£5m","£6m","£7m","£8m","£9m","£10m","£12m","£15m","> £15m"];
  const nationalityNames=[
    "Albania","Austria","Belgium","Bulgaria","Croatia","Cyprus","Czech Republic","Denmark","England","Estonia","Faroe Islands","Finland","France","Germany","Greece","Hungary",
    "Iceland","Israel","Italy","Latvia","Lithuania","Luxembourg","Malta","Holland","Northern Ireland","Norway","Poland","Portugal","Romania","Russia","San Marino","Scotland",
    "Slovenia","Sweden","Turkey","Ukraine","Wales","Serbia/Montenegro","Belarus","Slovakia","Spain","Armenia","Bosnia Herzegovina","Azerbaijan","Georgia","Switzerland","Republic of Ireland","FYR Macedonia",
    "Turkmenistan","Liechtenstein","Moldova","Costa Rica","El Salvador","Guatemala","Honduras","Bahamas","Mexico","Panama","U.S.A.","Bahrain","Nicaragua","Bermuda","Jamaica","Trinidad & Tobago",
    "Canada","Barbados","El Salvador (national)","St Vincent & Grenadines","Argentina","Bolivia","Brazil","Chile","Colombia","Ecuador","Paraguay","Suriname","Uruguay","Venezuela","Guyana","Peru",
    "Algeria","South Africa","Botswana","Burkina Faso","Burundi","Lesotho","DR Congo (Zaire)","Zambia","Ghana","Senegal","Ivory Coast","Tunisia","Mali","Madagascar","Cameroon","Chad",
    "Uganda","Liberia","Mozambique","Kenya","Sudan","Swaziland","Angola","Togo","Zimbabwe","Egypt","Tanzania","Nigeria","Ethiopia","Gabon","Sierra Leone","Benin",
    "Congo","Guinea","Sri Lanka (legacy)","Morocco","Gambia","Malawi","Japan","Taiwan","India","Bangladesh","Brunei","Iraq","Jordan","Sri Lanka","Syria","South Korea",
    "Iran","Vietnam","Malaysia","Saudi Arabia","Yemen","Kuwait","Laos","North Korea","Oman","Pakistan","Philippines","China","Singapore","Mauritius","Myanmar","Papua New Guinea",
    "Thailand","Uzbekistan","Qatar","United Arab Emirates","Australia","New Zealand","Fiji","Solomon Islands","Custom"
  ];

  const directApiAvailable = typeof window.showOpenFilePicker === "function";
  const saveAsApiAvailable = typeof window.showSaveFilePicker === "function";
  const directoryApiAvailable = typeof window.showDirectoryPicker === "function";
  let state={fileName:null,bytes:null,openingOriginal:null,savedBaseline:null,fileHandle:null,direct:false,kind:null,db:null,career:null,pool:null,view:"landing",teamIndex:null,playerIndex:null,careerPlayerIndex:null,poolIndex:null,filter:"all",query:"",playerQuery:"",poolQuery:"",playerClipboard:null,changed:new Set(),message:null};
  const main=document.getElementById("main"),topbar=document.getElementById("topbar"),footerbar=document.getElementById("footerbar"),fileMeta=document.getElementById("fileMeta"),modeLine=document.getElementById("modeLine"),fileInput=document.getElementById("fileInput"),undoBtn=document.getElementById("undoBtn"),primarySaveBtn=document.getElementById("primarySaveBtn");

  function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
  function hex(n){return "0x"+Number(n).toString(16).toUpperCase().padStart(2,"0")}
  function readText(bytes,offset,length){let s="";for(let i=0;i<length;i++){const b=bytes[offset+i];if(!b)break;s+=String.fromCharCode(b)}return s.replace(/\s+$/,"")}
  function divisionName(c){return divisions[c]??`Division ${c}`} function formationName(c){return formations[c]??`Unknown (${c})`}
  function positionInfo(byte){return positions[(byte>>5)&7]??["Unknown","?"]} function appearanceInfo(byte){return appearances[(byte>>3)&3]??"Unknown"}
  function nationalityName(code){return nationalityNames[code]??`Unknown code ${hex(code)}`}

  function validateTeam(bytes){if(bytes.length<2)throw new Error("This file is too small to be a SWOS TEAM database.");const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);const count=dv.getUint16(0,false);if(count<1)throw new Error("The file header reports zero teams.");const expected=HEADER_SIZE+count*TEAM_RECORD_SIZE;if(bytes.length!==expected)throw new Error(`File size check failed. Header says ${count} teams, so expected ${expected.toLocaleString()} bytes, but found ${bytes.length.toLocaleString()}.`);return count}
  function validatePool(bytes){if(bytes.length!==POOL_FILE_SIZE)throw new Error(`POOLPLYR.DAT size check failed. Expected ${POOL_COUNT} records × ${POOL_RECORD_SIZE} bytes = ${POOL_FILE_SIZE.toLocaleString()} bytes, but found ${bytes.length.toLocaleString()}.`);for(let i=0;i<POOL_COUNT;i++){const o=i*POOL_RECORD_SIZE;if(bytes[o+19]!==0)throw new Error(`Pool record ${i+1} has an unexpected separator byte.`)}return true}
  function validateCareer(bytes){if(bytes.length!==CAREER_FILE_SIZE)throw new Error(`Career file size check failed. This verified DOS SWOS career format is ${CAREER_FILE_SIZE.toLocaleString()} bytes; this file is ${bytes.length.toLocaleString()} bytes.`);const club=readText(bytes,C.club,C.clubLength),manager=readText(bytes,C.manager,C.managerLength);if(!club||!manager)throw new Error("This does not look like a supported SWOS career save.");return true}
  function getI32(offset){return new DataView(state.bytes.buffer,state.bytes.byteOffset,state.bytes.byteLength).getInt32(offset,true)}
  function setI32(offset,value){new DataView(state.bytes.buffer,state.bytes.byteOffset,state.bytes.byteLength).setInt32(offset,value,true)}
  function parseCareerPlayer(index){return parsePlayerAt(C.careerPlayers+index*PLAYER_RECORD_SIZE,index)}
  function parseCareer(){validateCareer(state.bytes);const players=[];for(let i=0;i<C.careerPlayerSlots;i++)players.push(parseCareerPlayer(i));const rawOrder=Array.from(state.bytes.slice(C.squadOrder,C.squadOrder+32)),squadOrder=[],seen=new Set();for(const idx of rawOrder){if(idx===255)break;if(idx>=0&&idx<C.careerPlayerSlots&&!seen.has(idx)){squadOrder.push(idx);seen.add(idx)}}state.career={club:readText(state.bytes,C.club,C.clubLength),manager:readText(state.bytes,C.manager,C.managerLength),currentBalance:getI32(C.currentBalance),previousBalance:getI32(C.previousBalance),competitionBonus:getI32(C.competitionBonus),sponsorship:getI32(C.sponsorship),embeddedClub:readText(state.bytes,C.currentTeam+T.name,T.nameLength),rawOrder,squadOrder,players,squad:squadOrder.map(i=>players[i])}}
  function validateCurrent(){if(state.kind==="career")return validateCareer(state.bytes);if(state.kind==="pool")return validatePool(state.bytes);return validateTeam(state.bytes)}
  function parseCurrent(){if(state.kind==="career")parseCareer();else if(state.kind==="pool")parsePool();else parseDb()}
  function readRawSkills(b,o){return [b[o+P.passing]&15,b[o+P.shootHead]>>4,b[o+P.shootHead]&15,b[o+P.tackleControl]>>4,b[o+P.tackleControl]&15,b[o+P.speedFinish]>>4,b[o+P.speedFinish]&15]}
  function parsePlayerAt(o,index){const rawSkills=readRawSkills(state.bytes,o);return{index,offset:o,nationality:state.bytes[o+P.nationality],shirt:state.bytes[o+P.shirt],name:readText(state.bytes,o+P.name,P.nameLength),multi:state.bytes[o+P.multi],position:(state.bytes[o+P.multi]>>5)&7,appearance:(state.bytes[o+P.multi]>>3)&3,rawSkills,levels:rawSkills.map(v=>v&7),value:state.bytes[o+P.value]}}
  function parsePlayer(teamOffset,index){return parsePlayerAt(teamOffset+T.players+index*PLAYER_RECORD_SIZE,index)}
  function parsePoolRecord(index){const o=index*POOL_RECORD_SIZE,player=parsePlayerAt(o+20,index);return{index,offset:o,teamNation:state.bytes[o],teamNumber:state.bytes[o+1],sourcePlayer:state.bytes[o+2],teamName:readText(state.bytes,o+3,16),separator:state.bytes[o+19],player}}
  function parsePool(){validatePool(state.bytes);const records=[];for(let i=0;i<POOL_COUNT;i++)records.push(parsePoolRecord(i));state.pool={count:POOL_COUNT,records}}
  function refreshPool(i){state.pool.records[i]=parsePoolRecord(i)}

  function parseKit(o){return{type:state.bytes[o],shirt1:state.bytes[o+1],shirt2:state.bytes[o+2],shorts:state.bytes[o+3],socks:state.bytes[o+4]}}
  function parseTeam(index){const o=HEADER_SIZE+index*TEAM_RECORD_SIZE,order=Array.from(state.bytes.slice(o+T.order,o+T.order+16)),players=[];for(let i=0;i<16;i++)players.push(parsePlayer(o,i));return{index,offset:o,name:readText(state.bytes,o+T.name,T.nameLength),coach:readText(state.bytes,o+T.coach,T.coachLength),tactic:state.bytes[o+T.tactic],division:state.bytes[o+T.division],homeKit:parseKit(o+T.homeKit),awayKit:parseKit(o+T.awayKit),order,players}}
  function parseDb(){const count=validateTeam(state.bytes),teams=[];for(let i=0;i<count;i++)teams.push(parseTeam(i));state.db={count,teams}}
  function orderedPlayers(team){const out=[],seen=new Set();for(const idx of team.order){if(idx>=0&&idx<16&&!seen.has(idx)){out.push(team.players[idx]);seen.add(idx)}}for(const p of team.players)if(!seen.has(p.index))out.push(p);return out}
  function refreshTeam(i){state.db.teams[i]=parseTeam(i)}
  function writeFixedText(offset,length,value,label){const v=String(value||"").toUpperCase();if(v.length>length)throw new Error(`${label} is longer than ${length} bytes.`);if(/[^\x20-\x7E]/.test(v))throw new Error(`${label} must use plain ASCII characters only.`);state.bytes.fill(0,offset,offset+length);for(let i=0;i<v.length;i++)state.bytes[offset+i]=v.charCodeAt(i)}
  function writeTeamDetails(team,form){const o=team.offset;writeFixedText(o+T.name,T.nameLength,form.name,"Team name");writeFixedText(o+T.coach,T.coachLength,form.coach,"Coach name");state.bytes[o+T.division]=form.division;state.bytes[o+T.tactic]=form.tactic;refreshTeam(team.index)}
  function validKitValue(v,max){return Number.isInteger(v)&&v>=0&&v<=max}
  function writeKit(team,which,kit){if(!validKitValue(kit.type,3)||![kit.shirt1,kit.shirt2,kit.shorts,kit.socks].every(v=>validKitValue(v,9)))throw new Error("Kit values are outside the supported SWOS range.");const o=team.offset+(which==="home"?T.homeKit:T.awayKit);state.bytes[o]=kit.type;state.bytes[o+1]=kit.shirt1;state.bytes[o+2]=kit.shirt2;state.bytes[o+3]=kit.shorts;state.bytes[o+4]=kit.socks;refreshTeam(team.index)}
  function normalisedTeamOrder(team){const out=[],seen=new Set();for(const x of team.order){if(x>=0&&x<16&&!seen.has(x)){out.push(x);seen.add(x)}}for(let i=0;i<16;i++)if(!seen.has(i))out.push(i);return out}
  function writeTeamOrder(team,order){if(order.length!==16||new Set(order).size!==16||order.some(v=>v<0||v>15))throw new Error("Invalid 16-player squad order.");for(let i=0;i<16;i++)state.bytes[team.offset+T.order+i]=order[i];refreshTeam(team.index)}
  function moveTeamOrder(team,from,to){const order=normalisedTeamOrder(team);if(from<0||to<0||from>=order.length||to>=order.length)return;const [x]=order.splice(from,1);order.splice(to,0,x);writeTeamOrder(team,order);state.changed.add(`order:${team.index}`)}

  function auditDatabase(){const structural=[],advisory=[];for(const t of state.db.teams){
      if(!t.name.trim())structural.push(`Team #${t.index+1}: blank team name`);
      if(t.division>4)structural.push(`${t.name||`Team #${t.index+1}`}: division byte ${t.division} is outside 0–4`);
      if(t.tactic>17)structural.push(`${t.name||`Team #${t.index+1}`}: tactic byte ${t.tactic} is outside 0–17`);
      for(const [label,k] of [["home",t.homeKit],["away",t.awayKit]])if(k.type>3||[k.shirt1,k.shirt2,k.shorts,k.socks].some(v=>v>9))structural.push(`${t.name}: ${label} kit has an out-of-range code`);

      }

  function writePlayer(p,form){const b=state.bytes,o=p.offset,name=form.name.toUpperCase();if(name.length>23)throw new Error("Player name is longer than 23 bytes.");if(/[^\x20-\x7E]/.test(name))throw new Error("Use plain ASCII characters only.");

  }

  async function writeAndVerifyHandle(handle,bytes){
    if(handle.requestPermission){const perm=await handle.requestPermission({mode:"readwrite"});if(perm!=="granted")throw new Error("Write permission was not granted.")}
    const writable=await handle.createWritable();await writable.write(bytes);await writable.close();
    const f=await handle.getFile(),check=new Uint8Array(await f.arrayBuffer());if(!byteEqual(check,bytes))throw new Error("The renamed career was written, but verification did not match. Keep your original career and do not use the new file.");
    return f;
  }
  async function renameCareerFile(requestedBase){
    if(state.kind!=="career"||!state.bytes)return;
    const base=cleanCareerBaseName(requestedBase),newName=`${base}.CAR`,oldName=state.fileName;
    if(!validCareerBaseName(base))return alert("Use 1–8 letters, numbers, hyphens or underscores for the career filename.");
    if(newName.toUpperCase()===String(oldName||"").toUpperCase())return alert("Choose a different career filename.");
    try{
      validateCareer(state.bytes);if(state.bytes.length!==state.openingOriginal.length)throw new Error("Rename blocked: file length changed.");
      let newHandle=null;
      if(saveAsApiAvailable){
        const opts={id:"swos-career-game",suggestedName:newName,types:[{description:"SWOS career save",accept:{"application/octet-stream":[".car"]}}]};
        if(state.fileHandle)opts.startIn=state.fileHandle;
        newHandle=await window.showSaveFilePicker(opts);
      }else if(directoryApiAvailable){
        const dir=await window.showDirectoryPicker({id:"swos-career-game",mode:"readwrite"});
        let exists=false;try{await dir.getFileHandle(newName);exists=true}catch(e){if(e.name!=="NotFoundError")throw e}
        if(exists&&!confirm(`${newName} already exists in that folder. Overwrite it?`))return;
        newHandle=await dir.getFileHandle(newName,{create:true});
      }else{
        download(state.bytes,newName);state.message=`Created ${newName} as a download. Your browser did not offer direct Save As access, so move it into the SWOS GAME folder manually. ${oldName} was not changed.`;render();window.scrollTo(0,0);return;
      }
      if(!/\.car$/i.test(newHandle.name))throw new Error("The new filename must end in .CAR.");
      const chosenBase=newHandle.name.replace(/\.car$/i,"").toUpperCase();if(!validCareerBaseName(chosenBase))throw new Error("SWOS career filenames should use 1–8 letters, numbers, hyphens or underscores before .CAR.");
      if(state.fileHandle&&state.fileHandle.isSameEntry&&await state.fileHandle.isSameEntry(newHandle))throw new Error("That is the same file you already opened. Choose a different filename.");
      const written=await writeAndVerifyHandle(newHandle,state.bytes);
      persistSafetyBackup();state.fileHandle=newHandle;state.fileName=written.name;state.direct=true;state.savedBaseline=state.bytes.slice();state.changed=new Set();parseCareer();
      state.message=`Career renamed safely: ${oldName} → ${state.fileName}. Keep the new .CAR in the main SWOS GAME folder so it appears in Load Old Competition. The old file was kept as a backup. ${state.fileName} is now the active career for future direct saves.`;render();window.scrollTo(0,0);
    }catch(e){if(e&&e.name==="AbortError")return;alert(`Career rename failed: ${e.message}\n\nYour original career has not been removed.`)}
  }

      <div class="section-gap"><h3 style="color:var(--yellow)">Reserves · ${reserves.length}</h3><div class="stack section-gap">${reserves.map(p=>careerPlayerRow(p,"Reserve")).join("")||'<div class="empty">No reserves found.</div>'}</div></div>
    </div>
    <div class="card stack section-gap"><h3>Finance information · read only</h3><div class="facts" style="margin:0"><div class="fact"><small>Previous balance</small><strong>${esc(money(c.previousBalance))}</strong></div><div class="fact"><small>Competition + TV</small><strong>${esc(money(c.competitionBonus))}</strong></div><div class="fact"><small>Sponsorship</small><strong>${esc(money(c.sponsorship))}</strong></div><div class="fact"><small>Current balance</small><strong>${esc(money(c.currentBalance))}</strong></div></div></div>
    ${state.direct?`<div class="card section-gap"><h3>Direct-save mode</h3><p class="about">After applying money or player changes, press <strong style="color:var(--text)">Save to SWOS</strong> below. The app overwrites this same .CAR file and verifies the write byte-for-byte.</p><button class="btn btn-blue" id="exportCopy">Export a copy instead</button></div>`:""}
    <details class="section-gap"><summary>Career squad format & safety</summary><div class="about section-gap">Active squad order begins at <code>0xDB60</code>.<br>Career player records begin at <code>0xDBCC</code> and use the same 38-byte player structure as the TEAM database.<br>The first 11 ordered players are the Starting XI, the next 5 are substitutes, and remaining ordered players are reserves.<br><br>Unused/deleted record slots are deliberately hidden rather than edited.<br><br>Rename Career never deletes the old .CAR automatically. This is intentional so a known-good copy survives if SWOS dislikes a renamed save.</div></details>`;
    const input=document.getElementById("balanceInput"),btn=document.getElementById("saveBalance");function valid(){const n=Number(input.value);const ok=Number.isInteger(n)&&n>=-2147483648&&n<=2147483647;btn.disabled=!ok}input.oninput=valid;valid();btn.onclick=()=>{const n=Number(input.value);if(!Number.isInteger(n)||n<-2147483648||n>2147483647)return;setI32(C.currentBalance,n);parseCareer();state.changed.add("career:balance");state.message=`Bank balance changed in memory to ${money(n)}. Press ${state.direct?"Save to SWOS":"Export file"} to write it.`;render();window.scrollTo(0,0)};
    const renameInput=document.getElementById("careerRenameInput"),renameBtn=document.getElementById("renameCareerBtn"),renameCounter=document.getElementById("careerRenameCounter");function renameValid(){const cleaned=cleanCareerBaseName(renameInput.value);if(renameInput.value!==cleaned)renameInput.value=cleaned;const ok=validCareerBaseName(cleaned),same=`${cleaned}.CAR`.toUpperCase()===String(state.fileName||"").toUpperCase();renameBtn.disabled=!ok||same;renameCounter.textContent=!ok?"Use 1–8 letters, numbers, hyphens or underscores.":same?"Enter a different filename.":`Will create ${cleaned}.CAR and keep ${state.fileName} as a backup.`;renameCounter.style.color=!ok?'var(--red)':'var(--muted)'}renameInput.oninput=renameValid;renameValid();renameBtn.onclick=()=>renameCareerFile(renameInput.value);
    document.getElementById("manageCareerOrder").onclick=()=>{state.view="careerOrder";state.message=null;render();window.scrollTo(0,0)};document.querySelectorAll("[data-career-player]").forEach(b=>b.onclick=()=>{state.careerPlayerIndex=Number(b.dataset.careerPlayer);state.view="careerPlayer";state.message=null;render();window.scrollTo(0,0)});if(state.direct)document.getElementById("exportCopy").onclick=exportCopy}

  function renderCareerOrder(){const c=state.career,rows=c.squadOrder.map((slot,i)=>{const p=c.players[slot],role=squadRole(i);return`<div class="order-row"><div class="order-no">${i+1}</div><div class="grow"><strong>${esc(p.name||"(empty player)")}</strong><div class="meta"><span class="role-badge">${role}</span> · ${esc(positionInfo(p.multi)[1])} · shirt ${p.shirt}</div></div><div class="move-buttons"><select class="btn" data-crole="${i}" aria-label="Move role"><option value="">Role…</option><option value="xi">XI</option><option value="sub">SUB</option><option value="res">RES</option></select><button class="btn" data-cup="${i}" ${i===0?'disabled':''}>↑</button><button class="btn" data-cdown="${i}" ${i===c.squadOrder.length-1?'disabled':''}>↓</button></div></div>`}).join("");
    main.innerHTML=`<button class="btn back" id="backCareer">← ${esc(c.club)} career</button><h2>Career squad order</h2><div class="notice info section-gap">Move players across the boundaries to change their role: <strong>1–11 = starting XI</strong>, <strong>12–16 = substitutes</strong>, <strong>17+ = reserves</strong>. Only the career squad-order bytes are changed.</div><div class="stack section-gap">${rows}</div>`;
    document.getElementById("backCareer").onclick=()=>{state.view="career";state.message=null;render();window.scrollTo(0,0)};document.querySelectorAll("[data-cup]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.cup);moveCareerOrder(i,i-1);render()});document.querySelectorAll("[data-cdown]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.cdown);moveCareerOrder(i,i+1);render()});document.querySelectorAll("[data-crole]").forEach(s=>s.onchange=()=>{if(!s.value)return;moveCareerToRole(Number(s.dataset.crole),s.value);render()})
  }

  function nationalityOptions(selected){return nationalityNames.map((name,i)=>`<option value="${i}" ${i===selected?'selected':''}>${name} (${hex(i)})</option>`).join("")}
  function positionOptions(selected){return positions.map((p,i)=>`<option value="${i}" ${i===selected?'selected':''}>${p[0]} (${p[1]})</option>`).join("")}
  function appearanceOptions(selected){return appearances.map((a,i)=>`<option value="${i}" ${i===selected?'selected':''}>${a}</option>`).join("")}
  function valueOptions(selected){return values.map((v,i)=>`<option value="${i}" ${i===selected?'selected':''}>${v} (${hex(i)})</option>`).join("")}

  function renderPlayer(){const team=state.db.teams[state.teamIndex],p=team.players[state.playerIndex],key=`${team.index}:${p.index}`,edited=state.changed.has(key);main.innerHTML=`<button class="btn back" id="backTeam">← ${esc(team.name)}</button><h2>Edit player</h2>
    <div class="card section-gap stack"><div class="field"><label>Player name — max 23 ASCII characters</label><input id="nameInput" value="${esc(p.name)}" maxlength="40" autocomplete="off" spellcheck="false"/><div class="counter" id="counter">${p.name.length}/23</div></div>
    <div class="grid2"><div class="field"><label>Nationality</label><select id="nationalityInput">${nationalityOptions(p.nationality)}</select></div><div class="field"><label>Shirt number</label><input id="shirtInput" type="number" min="0" max="99" value="${p.shirt}"/></div></div>
    <div class="grid2"><div class="field"><label>Position</label><select id="positionInput">${positionOptions(p.position)}</select></div><div class="field"><label>Appearance</label><select id="appearanceInput">${appearanceOptions(p.appearance)}</select></div></div>
    <div class="field"><label>Player value</label><select id="valueInput">${valueOptions(Math.min(p.value,49))}</select></div></div>
    <div class="section-gap"><div class="row"><h3 class="grow">Abilities · true SWOS level 0–7</h3></div><div class="split-actions section-gap"><button class="btn" id="preset7">All 7</button><button class="btn" id="preset4">All 4</button></div><button class="btn" style="width:100%;margin-top:9px" id="preset0">All 0</button><div class="skills section-gap">${skillNames.map((name,i)=>`<div class="skill"><div class="skill-head"><strong>${name}</strong><span class="skill-value" id="skillValue${i}">${p.levels[i]}</span></div><input type="range" min="0" max="7" step="1" value="${p.levels[i]}" data-skill="${i}"/><div class="tiny">Stored raw value now: ${p.rawSkills[i]}${p.rawSkills[i]>=8?' · transfer-filter flag is set':''}</div></div>`).join("")}</div></div>
    <div class="notice section-gap">When you change an ability, the app changes only its real 0–7 level and preserves SWOS’s hidden 8–15 flag. Position and appearance share one byte; the three unknown low bits are preserved unchanged.</div>
    <button class="btn btn-green big section-gap" id="savePlayer">Save player changes</button><div class="split-actions section-gap"><button class="btn btn-blue" id="copyPlayer">Copy player data</button><button class="btn btn-blue" id="pastePlayer" ${state.playerClipboard&&state.playerClipboard.kind==="team"?"":"disabled"}>Paste / replace</button></div><button class="btn big section-gap" id="restorePlayer">Restore this slot</button><button class="btn btn-blue big section-gap" id="transferPlayer">Transfer / swap with another club</button>${edited?'<div class="meta" style="text-align:center;margin-top:8px;color:var(--green)">This player already has an edit waiting to be saved/exported.</div>':''}
    <details class="section-gap"><summary>Advanced / raw player record</summary><div class="about section-gap">Record offset: ${p.offset}<br>Nationality: ${hex(p.nationality)}<br>Multipurpose byte: ${hex(p.multi)}<br>Unknown byte 27: ${hex(state.bytes[p.offset+27])}<br>Raw skills: ${p.rawSkills.join(', ')}<br>Value byte: ${hex(p.value)}</div></details>`;
    const name=document.getElementById("nameInput"),counter=document.getElementById("counter"),save=document.getElementById("savePlayer");document.querySelectorAll("[data-skill]").forEach(r=>r.oninput=()=>document.getElementById(`skillValue${r.dataset.skill}`).textContent=r.value);document.getElementById("preset7").onclick=()=>applySkillPreset(7);document.getElementById("preset4").onclick=()=>applySkillPreset(4);document.getElementById("preset0").onclick=()=>applySkillPreset(0);
    function formValid(){const v=name.value.toUpperCase();if(name.value!==v)name.value=v;const bad=/[^\x20-\x7E]/.test(v),too=v.length>23,shirt=Number(document.getElementById("shirtInput").value),badShirt=!Number.isInteger(shirt)||shirt<0||shirt>99;counter.textContent=`${v.length}/23${bad?' · plain ASCII only':''}${too?' · TOO LONG':''}${badShirt?' · shirt 0–99':''}`;counter.style.color=(bad||too||badShirt)?'var(--red)':'var(--muted)';save.disabled=bad||too||badShirt}name.oninput=formValid;document.getElementById("shirtInput").oninput=formValid;formValid();
    save.onclick=()=>{try{const levels=[...document.querySelectorAll("[data-skill]")].map(r=>Number(r.value));writePlayer(p,{name:name.value,nationality:Number(document.getElementById("nationalityInput").value),shirt:Number(document.getElementById("shirtInput").value),position:Number(document.getElementById("positionInput").value),appearance:Number(document.getElementById("appearanceInput").value),value:Number(document.getElementById("valueInput").value),levels});refreshTeam(team.index);state.changed.add(key);state.view="team";state.message=null;render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("copyPlayer").onclick=()=>{copyKnownPlayerData(p,`${p.name} · ${team.name}`,"team");state.message=`Copied known player data from ${p.name}. Open another database player and use Paste / replace.`;render()};document.getElementById("pastePlayer").onclick=()=>{try{if(!confirm(`Replace the known football data in this slot (${p.name}) with ${state.playerClipboard?.sourceLabel||"the copied player"}?\n\nThe final 5 unknown/reserved bytes in this slot are preserved.`))return;pasteKnownPlayerData(p,"team");refreshTeam(team.index);state.changed.add(key);state.message=`Replaced ${p.name} with copied player data from ${state.playerClipboard.sourceLabel}.`;state.view="team";render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("restorePlayer").onclick=()=>{try{if(!confirm(`Restore this player slot to its state at the last save/open?`))return;restorePlayerSlot(p);refreshTeam(team.index);state.changed.delete(key);state.message="Player slot restored from the last saved baseline.";state.view="team";render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("transferPlayer").onclick=()=>{state.view="transfer";state.message=null;render();window.scrollTo(0,0)};document.getElementById("backTeam").onclick=()=>{state.view="team";state.message=null;render();window.scrollTo(0,0)}}

  function renderCareerPlayer(){const p=state.career.players[state.careerPlayerIndex],orderPos=state.career.squadOrder.indexOf(p.index),role=orderPos<0?"Unused":orderPos<11?"Starting XI":orderPos<16?"Substitute":"Reserve",key=`career:player:${p.index}`,edited=state.changed.has(key);main.innerHTML=`<button class="btn back" id="backCareer">← ${esc(state.career.club)} career</button><h2>Edit career player</h2>
    <div class="notice info section-gap"><strong>${esc(role)}</strong> · This edits the copy of the player stored inside this career only.</div>
    <div class="card section-gap stack"><div class="field"><label>Player name — max 23 ASCII characters</label><input id="nameInput" value="${esc(p.name)}" maxlength="40" autocomplete="off" spellcheck="false"/><div class="counter" id="counter">${p.name.length}/23</div></div>
    <div class="grid2"><div class="field"><label>Nationality</label><select id="nationalityInput">${nationalityOptions(p.nationality)}</select></div><div class="field"><label>Shirt number</label><input id="shirtInput" type="number" min="0" max="99" value="${p.shirt}"/></div></div>
    <div class="grid2"><div class="field"><label>Position</label><select id="positionInput">${positionOptions(p.position)}</select></div><div class="field"><label>Appearance</label><select id="appearanceInput">${appearanceOptions(p.appearance)}</select></div></div>
    <div class="field"><label>Player value</label><select id="valueInput">${valueOptions(Math.min(p.value,49))}</select></div></div>
    <div class="section-gap"><div class="row"><h3 class="grow">Abilities · true SWOS level 0–7</h3></div><div class="split-actions section-gap"><button class="btn" id="preset7">All 7</button><button class="btn" id="preset4">All 4</button></div><button class="btn" style="width:100%;margin-top:9px" id="preset0">All 0</button><div class="skills section-gap">${skillNames.map((name,i)=>`<div class="skill"><div class="skill-head"><strong>${name}</strong><span class="skill-value" id="skillValue${i}">${p.levels[i]}</span></div><input type="range" min="0" max="7" step="1" value="${p.levels[i]}" data-skill="${i}"/><div class="tiny">Stored raw value now: ${p.rawSkills[i]}${p.rawSkills[i]>=8?' · transfer-filter flag is set':''}</div></div>`).join("")}</div></div>
    <div class="notice section-gap">The editor preserves SWOS's hidden skill flag and unknown bits exactly as it does for database players.</div>
    <button class="btn btn-green big section-gap" id="savePlayer">Apply career player changes</button><div class="split-actions section-gap"><button class="btn btn-blue" id="copyPlayer">Copy player data</button><button class="btn btn-blue" id="pastePlayer" ${state.playerClipboard&&state.playerClipboard.kind==="career"?"":"disabled"}>Paste / replace</button></div><button class="btn big section-gap" id="restorePlayer">Restore this career slot</button>${edited?'<div class="meta" style="text-align:center;margin-top:8px;color:var(--green)">This career player already has an edit waiting to be saved/exported.</div>':''}
    <details class="section-gap"><summary>Advanced / raw career player record</summary><div class="about section-gap">Career slot: ${p.index}<br>Record offset: <code>0x${p.offset.toString(16).toUpperCase()}</code><br>Nationality: ${hex(p.nationality)}<br>Multipurpose byte: ${hex(p.multi)}<br>Unknown byte 27: ${hex(state.bytes[p.offset+27])}<br>Raw skills: ${p.rawSkills.join(', ')}<br>Value byte: ${hex(p.value)}</div></details>`;
    const name=document.getElementById("nameInput"),counter=document.getElementById("counter"),save=document.getElementById("savePlayer");document.querySelectorAll("[data-skill]").forEach(r=>r.oninput=()=>document.getElementById(`skillValue${r.dataset.skill}`).textContent=r.value);document.getElementById("preset7").onclick=()=>applySkillPreset(7);document.getElementById("preset4").onclick=()=>applySkillPreset(4);document.getElementById("preset0").onclick=()=>applySkillPreset(0);
    function formValid(){const v=name.value.toUpperCase();if(name.value!==v)name.value=v;const bad=/[^\x20-\x7E]/.test(v),too=v.length>23,shirt=Number(document.getElementById("shirtInput").value),badShirt=!Number.isInteger(shirt)||shirt<0||shirt>99;counter.textContent=`${v.length}/23${bad?' · plain ASCII only':''}${too?' · TOO LONG':''}${badShirt?' · shirt 0–99':''}`;counter.style.color=(bad||too||badShirt)?'var(--red)':'var(--muted)';save.disabled=bad||too||badShirt}name.oninput=formValid;document.getElementById("shirtInput").oninput=formValid;formValid();
    save.onclick=()=>{try{const levels=[...document.querySelectorAll("[data-skill]")].map(r=>Number(r.value));writePlayer(p,{name:name.value,nationality:Number(document.getElementById("nationalityInput").value),shirt:Number(document.getElementById("shirtInput").value),position:Number(document.getElementById("positionInput").value),appearance:Number(document.getElementById("appearanceInput").value),value:Number(document.getElementById("valueInput").value),levels});state.changed.add(key);parseCareer();state.view="career";state.message=`Updated ${name.value.toUpperCase()} inside this career. Press ${state.direct?"Save to SWOS":"Export file"} to write it.`;render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("copyPlayer").onclick=()=>{copyKnownPlayerData(p,`${p.name} · ${state.career.club} career`,"career");state.message=`Copied known career-player data from ${p.name}. Open another career player and use Paste / replace.`;render()};document.getElementById("pastePlayer").onclick=()=>{try{if(!confirm(`Replace the known football data in this career slot (${p.name}) with ${state.playerClipboard?.sourceLabel||"the copied player"}?\n\nCareer-only trailing bytes in the destination slot are preserved.`))return;pasteKnownPlayerData(p,"career");state.changed.add(key);parseCareer();state.message=`Career player data replaced from ${state.playerClipboard.sourceLabel}.`;state.view="career";render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("restorePlayer").onclick=()=>{try{if(!confirm("Restore this career player slot to its state at the last save/open?"))return;restorePlayerSlot(p);state.changed.delete(key);parseCareer();state.message="Career player slot restored from the last saved baseline.";state.view="career";render();window.scrollTo(0,0)}catch(e){alert(e.message)}};document.getElementById("backCareer").onclick=()=>{state.view="career";state.message=null;render();window.scrollTo(0,0)}}

  function download(bytes,name){const copy=bytes.slice(),blob=new Blob([copy],{type:"application/octet-stream"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function exportCopy(){if(!state.bytes)return;try{validateCurrent();if(state.bytes.length!==state.openingOriginal.length)throw new Error("Export blocked: file length changed.");download(state.bytes,state.fileName);state.message=`Exported ${state.fileName} as a copy.`;state.view=state.kind==="career"?"career":state.kind==="pool"?"pool":"teams";render();window.scrollTo(0,0)}catch(e){alert(e.message)}}
  async function saveDirect(){if(!state.fileHandle)return exportCopy();try{validateCurrent();if(state.bytes.length!==state.openingOriginal.length)throw new Error("Save blocked: file length changed.");const folderHint=state.kind==="career"?"Career files should be in the main GAME folder.":state.kind==="pool"?"POOLPLYR.DAT should be in GAME/DATA.":"TEAM.* files should be in GAME/DATA.";if(!confirm(`Save changes directly over ${state.fileName} in its current folder?\n\n${folderHint}\nClose SWOS first. The app will keep an opening backup.`))return;const backed=persistSafetyBackup();if(state.fileHandle.requestPermission){const perm=await state.fileHandle.requestPermission({mode:"readwrite"});if(perm!=="granted")throw new Error("Write permission was not granted.")}
      const writable=await state.fileHandle.createWritable();await writable.write(state.bytes);await writable.close();const checkFile=await state.fileHandle.getFile(),check=new Uint8Array(await checkFile.arrayBuffer());if(!byteEqual(check,state.bytes))throw new Error("The file was written but verification did not match. Restore from your backup before using SWOS.");state.savedBaseline=state.bytes.slice();state.changed=new Set();parseCurrent();state.view=state.kind==="career"?"career":state.kind==="pool"?"pool":"teams";state.message=`Saved directly over ${state.fileName} and verified it byte-for-byte.${backed?' Opening backup stored in this browser.':''} Restart SWOS / Magic DOSBox to load the changes.`;render();window.scrollTo(0,0)}catch(e){alert(`Direct save failed: ${e.message}\n\nYour in-app edits are still here. You can use Export a copy instead.`)}}

  fileInput.onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;try{await loadFile(f,null,false)}catch(err){state={...state,bytes:null,openingOriginal:null,savedBaseline:null,fileHandle:null,direct:false,kind:null,db:null,career:null,view:"landing",message:err.message};render()}};
  document.getElementById("brandHome").onclick=()=>{if(!state.kind){state.view="landing"}else{state.view=state.kind==="career"?"career":"teams"}state.message=null;render();window.scrollTo(0,0)};
  primarySaveBtn.onclick=()=>state.direct?saveDirect():exportCopy();
  document.getElementById("backupBtn").onclick=()=>{if(state.openingOriginal)download(state.openingOriginal,`${state.fileName}.opening-backup`)};
  undoBtn.onclick=()=>{if(!state.savedBaseline||state.changed.size===0)return;if(!confirm("Undo edits made since the last direct save (or since opening the file)?"))return;state.bytes=state.savedBaseline.slice();state.changed=new Set();parseCurrent();state.view=state.kind==="career"?"career":state.kind==="pool"?"pool":"teams";state.message="Pending edits were undone.";render();window.scrollTo(0,0)};
  render();
})();
</script>
